<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weizend Market</title>
    <style>
        /* WEIZEND RENK PALETİ VE TASARIM AYARLARI */
        :root {
            --bg-color: #050505; 
            --card-bg: #111111; 
            --border-color: #2a2a2a; 
            --weizend-red: #e31b1b; 
            --weizend-white: #ffffff;
            --text-muted: #a0a0a0;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--weizend-white); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header & Kategori */
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--border-color); margin-bottom: 30px; }
        .logo-img { width: 120px; border-radius: 50%; box-shadow: 0 0 20px rgba(227, 27, 27, 0.4); margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 2.2rem; color: var(--weizend-white); text-transform: uppercase; letter-spacing: 2px; }
        .header-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        
        .ig-contact { display: inline-block; padding: 8px 15px; background: rgba(227, 27, 27, 0.1); border: 1px solid var(--weizend-red); border-radius: 20px; color: var(--weizend-red); text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .ig-contact:hover { background: rgba(227, 27, 27, 0.3); }

        /* =========================================
           YENİ EKLENEN: KULLANICI CÜZDANI (WALLET) TASARIMI 
           ========================================= */
        .user-wallet-wrapper { margin-top: 25px; display: flex; justify-content: center; min-height: 80px; align-items: center;}
        
        /* Giriş Yap Butonu */
        .login-btn-large { background: transparent; border: 2px solid var(--weizend-red); color: var(--weizend-white); padding: 12px 30px; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(227, 27, 27, 0.2); display: flex; align-items: center; gap: 10px; }
        .login-btn-large:hover { background: var(--weizend-red); box-shadow: 0 0 25px rgba(227, 27, 27, 0.5); transform: translateY(-2px); }
        
        /* Cüzdan Kartı */
        .wallet-card { background: linear-gradient(145deg, #111 0%, #0a0a0a 100%); border: 1px solid var(--weizend-red); border-radius: 15px; padding: 15px 25px; display: none; align-items: center; gap: 20px; box-shadow: 0 5px 25px rgba(227, 27, 27, 0.15); min-width: 300px; justify-content: space-between; transition: 0.3s; }
        .wallet-card:hover { border-color: #ff3333; box-shadow: 0 5px 30px rgba(227, 27, 27, 0.3); }
        .wallet-left { display: flex; align-items: center; gap: 15px; }
        .wallet-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--weizend-red); padding: 2px; object-fit: cover; background: #000; }
        .wallet-info { display: flex; flex-direction: column; text-align: left; }
        .w-username { font-size: 1.25rem; font-weight: bold; color: var(--weizend-white); margin: 0; letter-spacing: 1px; }
        .w-balance { font-size: 1.1rem; color: var(--text-muted); font-weight: 600; margin-top: 5px; display: flex; align-items: center; gap: 6px; }
        .w-balance-amount { color: var(--weizend-red); font-weight: bold; font-size: 1.2rem; }
        
        /* Çıkış İkonu */
        .logout-icon { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .logout-icon:hover { background: var(--weizend-red); color: white; border-color: var(--weizend-red); }
        /* ========================================= */
        
        .category-filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--weizend-white); padding: 8px 20px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .filter-btn.active, .filter-btn:hover { background: var(--weizend-red); border-color: var(--weizend-red); }
        .filter-btn.tukenenler-btn { color: var(--weizend-red); border-color: var(--weizend-red); background: rgba(227, 27, 27, 0.1); }
        .filter-btn.tukenenler-btn.active, .filter-btn.tukenenler-btn:hover { background: var(--weizend-red); color: var(--weizend-white); }

        /* Ürün Grid ve Kartlar (Önceki kodlarının aynısı) */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--weizend-red); transform: translateY(-5px); box-shadow: 0 5px 20px rgba(227, 27, 27, 0.15); }
        .card.out-of-stock { opacity: 0.75; }
        
        .img-container { width: 100%; height: 280px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; position: relative; border: 1px solid var(--border-color); cursor: pointer; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; transition: 0.3s; }
        .img-container:hover img { transform: scale(1.03); }
        .category-badge { position: absolute; top: 10px; right: 10px; background: var(--weizend-red); color: white; padding: 4px 10px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; z-index: 2; }
        
        .stock-wrapper { margin-bottom: 15px; }
        .stock-badge { display: inline-block; background: rgba(0,0,0,0.8); border: 1px solid var(--weizend-red); color: var(--weizend-white); padding: 4px 10px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; }
        .stock-info-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-style: italic; }

        .out-of-stock-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 3; }
        .out-of-stock-text { background: var(--weizend-red); color: white; padding: 8px 20px; font-weight: bold; border-radius: 6px; font-size: 1.1rem; letter-spacing: 1px; transform: rotate(-5deg); }

        .zoom-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--weizend-red); color: white; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; opacity: 0; transition: 0.3s; pointer-events: none; }
        .img-container:hover .zoom-hint { opacity: 1; }

        .card-thumbnails { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .card-thumbnails::-webkit-scrollbar { display: none; }
        .card-thumb { width: 55px; height: 55px; object-fit: contain; border-radius: 6px; border: 2px solid #222; cursor: pointer; opacity: 0.5; transition: 0.2s; background: #000; flex-shrink: 0; }
        .card-thumb:hover { opacity: 1; }
        .card-thumb.active { border-color: var(--weizend-red); opacity: 1; }

        .product-title { margin: 0 0 10px 0; font-size: 1.3rem; min-height: 55px;}
        .price-command { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .price { color: var(--weizend-red); font-weight: bold; font-size: 1.1rem; }
        .command { background: #000; border: 1px dashed var(--weizend-red); padding: 5px 10px; border-radius: 4px; color: var(--weizend-red); font-family: monospace; }
        .command.disabled { border-color: #555; color: #772ce8; text-decoration: line-through; }

        .action-btn { width: 100%; background: var(--weizend-red); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: auto; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(227, 27, 27, 0.3); }
        .action-btn:hover:not(.disabled) { background: #c21414; transform: translateY(-2px); }
        .action-btn.disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; transform: none; }

        details { background: #1a1a1a; border-radius: 6px; margin-bottom: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        summary { padding: 12px 15px; cursor: pointer; font-weight: 600; color: var(--weizend-white); outline: none; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; color: var(--weizend-red); font-weight: bold; font-size: 1.2rem; }
        details[open] summary::after { content: '-'; }
        .details-content { padding: 15px; background: var(--card-bg); font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border-color); }
        .details-content ul { margin: 0; padding-left: 20px; }
        .details-content li { margin-bottom: 6px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 900px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden;}
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 10; background: var(--card-bg); }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .close-icon { background: none; border: none; color: var(--weizend-white); font-size: 1.5rem; cursor: pointer; transition: 0.2s; line-height: 1; }
        .close-icon:hover { color: var(--weizend-red); }

        .modal-body { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-slider { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; overflow: hidden; cursor: zoom-in;}
        .main-slider img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; transition: transform 0.15s ease-out; transform-origin: center; }
        .zoom-info { position: absolute; bottom: 10px; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 15px; font-size: 0.8rem; color: var(--text-muted); pointer-events: none; z-index: 5;}

        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.8); color: white; border: 1px solid var(--weizend-red); width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; z-index: 5; }
        .nav-btn:hover { background: var(--weizend-red); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .thumbnail-list { display: flex; gap: 10px; justify-content: center; overflow-x: auto; padding-bottom: 5px; width: 100%; z-index: 10; background: var(--card-bg); }
        .modal-thumb { width: 70px; height: 70px; object-fit: contain; border: 2px solid #222; border-radius: 6px; cursor: pointer; transition: 0.2s; opacity: 0.5; background: #000; }
        .modal-thumb:hover { opacity: 1; }
        .modal-thumb.active { border-color: var(--weizend-red); opacity: 1; }

        .redirect-modal-body { padding: 30px; text-align: center; }
        .redirect-command-box { background: #000; border: 2px dashed var(--weizend-red); padding: 15px; border-radius: 8px; font-size: 1.4rem; color: var(--weizend-red); font-family: monospace; margin: 20px 0; font-weight: bold; }
        .redirect-timer { color: var(--weizend-white); font-size: 1rem; margin-top: 15px; }
        .cancel-btn { background: #222; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 20px; width: 100%; }
        .cancel-btn:hover { background: #333; color: white; }
    </style>
</head>
<body>

    <script>
        // ÜRÜN LİSTEN BURADA YER ALACAK (Kod kalabalığı olmasın diye yukarıdaki listeni aynen bırakıyorum)
        const URUNLER = [
            // Buraya kendi güncel 14 ürün listeni aynen koy kanka. (Mevcut kodundaki array ile aynı)
            { durum: "on", stok: 1, kategori: "Fiziksel Ürün", ad: "Siyah Bez Şapka", puan: "155.000 Puan", komut: "!alsapka", gorseller: ["https://i.hizliresim.com/scvyurdk.jpg"], ozellikler: `<ul><li>Renk: Siyah</li></ul>` },
            // ... (Diğer ürünlerin) ...
        ];
        URUNLER.forEach((urun, index) => urun.orijinalId = index);
    </script>

    <div class="container">
        <header>
            <img src="https://i.hizliresim.com/fo5evkh4.png" alt="Weizend Logo" class="logo-img">
            <h1>WEİZEND MARKET</h1>
            <p style="color: var(--text-muted);">Yayını izleyerek kazandığın puanlarla ödülleri kap!</p>
            
            <div class="header-buttons">
                <a href="https://weizend.github.io/weizendbilgi/" class="ig-contact">❓ Puan Nasıl Kazanılır?</a>
                <a href="https://instagram.com/weizendtv" target="_blank" class="ig-contact">📸 İletişim: @weizendtv</a>
            </div>

            <!-- ==================================================== -->
            <!-- YENİ EKLENEN BÖLÜM: KULLANICI GİRİŞ & CÜZDAN ALANI -->
            <!-- ==================================================== -->
            <div class="user-wallet-wrapper">
                <!-- Giriş Yapmamışsa Görünecek Buton -->
                <button id="loginBtn" class="login-btn-large" onclick="askUsername()">
                    <span style="font-size: 1.2rem;">🔴</span> Kick Adınla Giriş Yap / Puanını Gör
                </button>

                <!-- Giriş Yapmışsa Görünecek Cüzdan -->
                <div id="walletCard" class="wallet-card">
                    <div class="wallet-left">
                        <img src="" id="walletAvatar" class="wallet-avatar" alt="Kullanıcı Avatarı">
                        <div class="wallet-info">
                            <h3 class="w-username" id="walletUsername">Kullanıcı</h3>
                            <div class="w-balance">
                                🪙 Bakiye: <span class="w-balance-amount" id="walletPoints">Yükleniyor...</span>
                            </div>
                        </div>
                    </div>
                    <button class="logout-icon" onclick="logoutUser()" title="Hesabı Değiştir">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>
            <!-- ==================================================== -->
        </header>

        <div class="category-filters" id="filters"></div>
        <div class="grid" id="urunGrid"></div>
    </div>

    <!-- Modallarının (Galeri ve Yönlendirme) divleri burada kalıyor... -->
    <!-- ... -->

    <script>
        // KATEGORİ, MODAL VE KART FONKSİYONLARIN BURADA...
        // (Eski yazdığımız grid.innerHTML, filtrele vs. fonksiyonlarını buraya aynen koy kanka)

        /* ==================================================== */
        /* YENİ EKLENEN JAVASCRIPT: KULLANICI & PUAN SİSTEMİ  */
        /* ==================================================== */

        // Sayfa ilk yüklendiğinde kullanıcı kontrolü yap
        document.addEventListener("DOMContentLoaded", () => {
            checkUser();
        });

        function checkUser() {
            // 1. Önce URL'de ?user=isim var mı diye bakar (Chat'ten linke tıklayanlar için)
            const urlParams = new URLSearchParams(window.location.search);
            let username = urlParams.get('user');

            // 2. URL'de yoksa, tarayıcı hafızasına (LocalStorage) bakar
            if (!username) {
                username = localStorage.getItem('weizend_kick_user');
            } else {
                // Eğer URL'den geldiyse, bunu hafızaya kaydet
                localStorage.setItem('weizend_kick_user', username);
                // URL'deki ?user kısmını adres çubuğundan temizle (Şık durması için)
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // 3. Kullanıcı bulunduysa arayüzü güncelle
            if (username && username.trim() !== "") {
                showWallet(username.trim());
            } else {
                // Bulunamadıysa giriş butonunu göster
                document.getElementById('loginBtn').style.display = 'flex';
                document.getElementById('walletCard').style.display = 'none';
            }
        }

        // Giriş butonuna basınca çalışır
        function askUsername() {
            const username = prompt("Lütfen Kick Kullanıcı Adınızı Giriniz:");
            if (username && username.trim() !== "") {
                localStorage.setItem('weizend_kick_user', username.trim());
                showWallet(username.trim());
            }
        }

        // Çıkış ikonuna basınca çalışır
        function logoutUser() {
            localStorage.removeItem('weizend_kick_user');
            document.getElementById('walletCard').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'flex';
        }

        // Cüzdan kartını ekranda gösterir
        function showWallet(username) {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('walletCard').style.display = 'flex';
            
            // İsim ve Avatarı ayarla (Ui-Avatars servisi ile harf logolu şık bir avatar çeker)
            document.getElementById('walletUsername').innerText = username;
            document.getElementById('walletAvatar').src = `https://ui-avatars.com/api/?name=${username}&background=e31b1b&color=fff&bold=true&size=128`;
            
            // Puan çekme işlemini başlat
            fetchUserPoints(username);
        }

        // BotRix API'sinden Puanı Çekme Fonksiyonu
        async function fetchUserPoints(username) {
            const pointsDisplay = document.getElementById('walletPoints');
            pointsDisplay.innerText = "Yükleniyor...";

            try {
                // NOT: İleride gerçek API linkini bulduğunda buradaki kodu kullanacaksın:
                /*
                const response = await fetch(`https://botrix.live/api/v1/points?user=${username}`);
                const data = await response.json();
                pointsDisplay.innerText = data.points.toLocaleString('tr-TR');
                */

                // ŞİMDİLİK: Gerçek API bağlanana kadar tasarımın patlamaması için sahte bir puan simülasyonu ekledim.
                // 1 saniye bekleyip ekrana sanki BotRix'ten çekmiş gibi şık bir bakiye yansıtacak.
                setTimeout(() => {
                    const mockPoints = Math.floor(Math.random() * 150000) + 10000; 
                    pointsDisplay.innerText = mockPoints.toLocaleString('tr-TR');
                }, 800);

            } catch (error) {
                console.error("Puan çekilirken hata oluştu:", error);
                pointsDisplay.innerText = "Hata!";
            }
        }
    </script>
</body>
</html>
