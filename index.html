<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buğlem'in Harf Okulu 🌟</title>
<style>
:root{--p:#ff4757;--b:#1e90ff;--y:#ffa502;--g:#2ed573;--d:#2f3542;--bg:#f4f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:radial-gradient(#dfe4ea 1.5px,transparent 1.5px) 0 0/28px 28px,var(--bg);color:var(--d);min-height:100vh;user-select:none}.top{position:sticky;top:0;z-index:30;background:#ffffffed;backdrop-filter:blur(10px);padding:10px 12px;box-shadow:0 3px 16px #0001}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.pill{border:0;border-radius:18px;padding:10px 14px;font-weight:900;background:#eef2f7;color:var(--d)}.money{background:var(--g);color:#fff}.progress{height:10px;background:#e8edf3;border-radius:20px;overflow:hidden;margin-top:9px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--g));transition:.35s}.groups{display:flex;gap:8px;overflow:auto;padding:10px 0 3px;scrollbar-width:none}.groups::-webkit-scrollbar{display:none}.group{flex:0 0 auto;border:0;border-radius:15px;padding:8px 12px;font-weight:900;background:#f1f2f6}.group.active{background:var(--b);color:#fff}.letters{display:flex;gap:7px;overflow:auto;padding:8px 0 2px;scrollbar-width:none}.letter{min-width:45px;height:45px;border:0;border-radius:14px;background:#eef2f7;font-size:21px;font-weight:900}.letter.active{background:var(--p);color:#fff;transform:scale(1.07)}.letter.locked{opacity:.42}.app{max-width:760px;margin:auto;padding:14px}.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 14px 40px #22304a18;text-align:center;min-height:470px;position:relative;overflow:hidden}.badge{display:inline-block;background:#eef5ff;color:var(--b);font-weight:900;padding:8px 13px;border-radius:16px}.title{font-size:clamp(21px,5vw,31px);margin:12px 0 5px}.sub{color:#667085;font-weight:700;line-height:1.45}.heroLetter{font-size:clamp(110px,32vw,210px);line-height:1;font-weight:900;color:var(--p);text-shadow:5px 5px 0 #ffd166;margin:18px}.btn{border:0;border-radius:17px;padding:14px 20px;font-size:17px;font-weight:900;background:var(--b);color:white;box-shadow:0 5px 0 #0b69c7;margin:7px;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:none}.btn.orange{background:var(--y);box-shadow:0 5px 0 #c77d00}.btn.green{background:var(--g);box-shadow:0 5px 0 #1aa95a}.btn.red{background:var(--p);box-shadow:0 5px 0 #c92f3d}.options{display:grid;grid-template-columns:repeat(3,minmax(75px,1fr));gap:12px;margin:20px auto;max-width:500px}.opt{min-height:92px;border:4px solid #dfe4ea;background:#f8fafc;border-radius:20px;font-size:42px;font-weight:900;color:var(--d)}.opt.good{background:#dff9e8;border-color:var(--g)}.opt.bad{animation:shake .3s;background:#ffe7e9;border-color:var(--p)}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.traceWrap{width:min(86vw,340px);height:340px;margin:15px auto;position:relative;border:4px dashed #ccd5df;border-radius:24px;background:#fbfcfe;overflow:hidden;touch-action:none}.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:230px;font-weight:900;color:#0000000d;pointer-events:none}.traceWrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.guide{width:min(90vw,430px);height:300px;margin:12px auto;background:#fbfcfe;border-radius:24px;border:3px solid #e5e9ef}.guide text{font-weight:900;fill:#0000000b}.guide path{fill:none;stroke:var(--p);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:write 1.1s ease forwards}.guide .dot{fill:var(--b)}@keyframes write{to{stroke-dashoffset:0}}.stars{font-size:30px;letter-spacing:5px;color:#ffc107}.mini{font-size:14px;color:#778;font-weight:700}.toast{position:fixed;left:50%;bottom:-100px;transform:translateX(-50%);z-index:99;padding:13px 20px;border-radius:30px;background:var(--d);color:#fff;font-weight:900;transition:.25s;max-width:90vw;text-align:center}.toast.show{bottom:25px}.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:430px;margin:18px auto}.mem{height:70px;border:0;border-radius:15px;background:#eaf1fa;font-size:28px;font-weight:900}.soundOrb{width:150px;height:150px;border-radius:50%;border:0;background:linear-gradient(145deg,#ff6b81,var(--p));color:#fff;font-size:72px;font-weight:900;box-shadow:0 12px 25px #ff475744}.footerNote{font-size:12px;color:#98a2b3;margin-top:12px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalBox{background:white;border-radius:25px;padding:22px;max-width:460px;width:100%;text-align:left}.modalBox h3{margin-top:0}.switch{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.bigFinish{background:linear-gradient(135deg,#ffa502,#ff6b81);color:#fff}.bigFinish .title,.bigFinish .sub{color:#fff}@media(max-width:480px){.card{padding:15px;min-height:500px}.options{gap:8px}.opt{min-height:80px}.traceWrap{height:300px}.heroLetter{margin:12px}.top{padding:8px}}
</style>
</head>
<body>
<div class="top"><div class="row between"><button class="pill" onclick="openSettings()">⚙️ Ayarlar</button><div class="pill" id="where">1. Grup • A</div><div class="pill money">🐷 <span id="money">0</span> TL</div></div><div class="progress"><i id="progressBar"></i></div><div class="groups" id="groups"></div><div class="letters" id="letters"></div></div>
<main class="app"><section class="card" id="card"></section></main><div class="toast" id="toast"></div><canvas class="confetti" id="confetti"></canvas>
<div class="modal" id="settings"><div class="modalBox"><h3>👨‍👩‍👧 Ebeveyn Ayarları</h3><div class="switch"><b>Eğitici seslendirme</b><input id="voiceToggle" type="checkbox" checked onchange="saveSettings()"></div><div class="switch"><b>Yanlışta puan düşsün</b><input id="penaltyToggle" type="checkbox" checked onchange="saveSettings()"></div><p class="mini">İlerleme ve kazanılan TL bu cihazda saklanır.</p><button class="btn" onclick="closeSettings()">Kapat</button><button class="btn red" onclick="resetAll()">İlerlemeyi Sıfırla</button></div></div>
<script>
const GROUPS=[['A','N','E','T','İ','L'],['O','K','U','R','I','M'],['Ü','S','Ö','Y','D','Z'],['Ç','B','G','C','Ş'],['P','H','V','Ğ','F','J']];
const ALL=GROUPS.flat();
const lowerOf=x=>({'I':'ı','İ':'i','Ğ':'ğ','Ü':'ü','Ö':'ö','Ş':'ş','Ç':'ç'}[x]||x.toLowerCase());
const state=JSON.parse(localStorage.getItem('buglem_harf_v4')||'null')||{letter:0,case:'upper',level:1,money:0,unlocked:0};
let voiceOn=localStorage.getItem('buglem_voice')!=='0',penalty=localStorage.getItem('buglem_penalty')!=='0';
const $=s=>document.querySelector(s), card=$('#card');
function save(){localStorage.setItem('buglem_harf_v4',JSON.stringify(state))} function saveSettings(){voiceOn=$('#voiceToggle').checked;penalty=$('#penaltyToggle').checked;localStorage.setItem('buglem_voice',voiceOn?'1':'0');localStorage.setItem('buglem_penalty',penalty?'1':'0')}
function speak(t){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices(),tr=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('tr'));u.voice=tr.find(v=>/female|emel|seda|filiz|google|microsoft/i.test(v.name))||tr[0]||null;u.lang='tr-TR';u.rate=.88;u.pitch=1.18;speechSynthesis.speak(u)}
function sound(ok=true){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?760:180;g.gain.value=.06;o.start();o.stop(a.currentTime+.16)}catch(e){}}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function reward(){state.money+=10;sound(1);save();updateTop()} function wrong(t='Tekrar deneyelim!'){if(penalty)state.money=Math.max(0,state.money-2);sound(0);save();updateTop();toast(t);speak('Aaa, olmadı. Bir daha deneyelim Buğlem.')}
function currentUpper(){return ALL[state.letter]} function current(){return state.case==='upper'?currentUpper():lowerOf(currentUpper())}
function groupIndex(i=state.letter){let n=i;for(let g=0;g<GROUPS.length;g++){if(n<GROUPS[g].length)return g;n-=GROUPS[g].length}return 4}
function buildNav(){let gs=$('#groups');gs.innerHTML='';GROUPS.forEach((g,i)=>{let b=document.createElement('button');b.className='group '+(i===groupIndex()?'active':'');b.textContent=(i+1)+'. Grup: '+g.join(' ');b.onclick=()=>{let first=GROUPS.slice(0,i).flat().length;if(first<=state.unlocked){state.letter=first;state.case='upper';state.level=1;render() }else speak('Önce önceki harfleri tamamlayalım.');};gs.appendChild(b)});let ls=$('#letters');ls.innerHTML='';ALL.forEach((l,i)=>{let b=document.createElement('button');b.className='letter '+(i===state.letter?'active':'')+(i>state.unlocked?' locked':'');b.textContent=l;b.onclick=()=>{if(i<=state.unlocked){state.letter=i;state.case='upper';state.level=1;render()}else speak(l+' harfi henüz kilitli. Önce sırayla ilerleyelim.');};ls.appendChild(b)});setTimeout(()=>$('.letter.active')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),50)}
function updateTop(){let g=groupIndex()+1;$('#where').textContent=g+'. Grup • '+currentUpper()+' • '+(state.case==='upper'?'Büyük':'Küçük')+' • '+state.level+'/25';$('#money').textContent=state.money;let total=ALL.length*50,done=state.letter*50+(state.case==='lower'?25:0)+(state.level-1);$('#progressBar').style.width=(done/total*100)+'%';buildNav()}
const titles=['Sesi Dinle','Yazım Yönünü İzle','Parmağınla Üzerinden Geç','Doğru Harfi Bul','Ses Avı','Harf Eşleştir','Hafıza Oyunu','Eksik Harfi Tamamla','Hızlı Bul','Harf Balonu','Tekrar Dinle','Yönü Hatırla','Çiz ve Kontrol Et','Karışık Harfler','Aynısını Yakala','Harf Treni','Gölgesini Bul','Sesini Söyle','Mini Hafıza','Doğru Kapı','Serbest Çizim','Hızlı Seçim','Usta Çizim','Final Testi','Harf Ustası'];
function intro(){let c=current(),kind=state.case==='upper'?'büyük':'küçük';return `<span class="badge">${state.level}. Bölüm / 25</span><h1 class="title">${titles[state.level-1]}</h1><p class="sub">${kind} <b>${c}</b> harfi • Kolaydan zora</p>`}
function render(){save();updateTop();let l=state.level;if(l===1||l===11)listenGame();else if(l===2||l===12)directionGame();else if([3,13,21,23].includes(l))drawGame(l===23);else if([7,19].includes(l))memoryGame();else if([8,16].includes(l))missingGame();else choiceGame(l);setTimeout(()=>announce(),250)}
function announce(){let c=current(),k=state.case==='upper'?'büyük':'küçük';let msg={1:`Buğlem, şimdi ${k} ${c} harfinin sesini dinleyelim. Harfe dokun.`,2:`Şimdi ${c} harfinin nereden başlayıp hangi yönde yazıldığını izleyelim.`,3:`Parmağınla ${c} harfinin üzerinden geç. Çizim alanının dışına çıkma.`}[state.level]||`${state.level}. bölüm. ${k} ${c} harfiyle oyuna devam ediyoruz.`;speak(msg)}
function listenGame(){let c=current();card.innerHTML=intro()+`<button class="soundOrb" id="soundOrb">${c}</button><p class="sub">Harfe <b>5 kez</b> dokun ve sesini dinle.</p><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div>`;let n=0;$('#soundOrb').onclick=()=>{speak(`${state.case==='upper'?'Büyük':'Küçük'} ${c}. ${c} sesi.`);n++;$('#stars').textContent=Array(5).fill(0).map((_,i)=>i<n?'★':'☆').join(' ');if(n===5){reward();setTimeout(completeLevel,900)}}}
function guidePaths(ch){let U=ch.toUpperCase();const M={A:['M85 245 L160 45','M160 45 L235 245','M115 165 L205 165'],N:['M90 245 L90 55','M90 55 L230 245','M230 245 L230 55'],E:['M225 55 L90 55 L90 245','M90 150 L200 150','M90 245 L225 245'],T:['M75 55 L245 55','M160 55 L160 245'],İ:['M160 55 L160 245','M160 22 L161 22'],I:['M160 55 L160 245'],L:['M95 55 L95 245 L230 245'],O:['M160 50 C70 50 70 250 160 250 C250 250 250 50 160 50'],K:['M95 50 L95 250','M230 50 L95 155 L235 250'],U:['M90 50 L90 190 C90 270 230 270 230 190 L230 50'],R:['M90 250 L90 50 L175 50 C245 50 245 150 175 150 L90 150','M165 150 L240 250'],M:['M70 250 L70 50 L160 165 L250 50 L250 250'],Ü:['M90 60 L90 190 C90 270 230 270 230 190 L230 60','M125 28 L126 28','M195 28 L196 28'],S:['M230 70 C190 35 95 45 95 105 C95 155 225 140 225 205 C225 265 120 270 80 230'],Ö:['M160 60 C75 60 75 250 160 250 C245 250 245 60 160 60','M125 28 L126 28','M195 28 L196 28'],Y:['M75 55 L160 155 L245 55','M160 155 L160 250'],D:['M90 250 L90 50 L160 50 C260 50 260 250 160 250 Z'],Z:['M80 55 L240 55 L80 245 L240 245'],Ç:['M235 80 C190 35 85 55 85 150 C85 245 190 265 235 220','M150 260 L140 285'],B:['M90 250 L90 50 L175 50 C240 50 240 145 175 145 L90 145','M175 145 C250 145 250 250 175 250 L90 250'],G:['M235 85 C190 35 80 55 80 150 C80 245 190 270 235 215 L235 165 L175 165'],C:['M235 80 C190 35 85 55 85 150 C85 245 190 265 235 220'],Ş:['M230 70 C190 35 95 45 95 105 C95 155 225 140 225 205 C225 265 120 270 80 230','M155 265 L145 290'],P:['M90 250 L90 50 L175 50 C250 50 250 155 175 155 L90 155'],H:['M90 50 L90 250','M230 50 L230 250','M90 150 L230 150'],V:['M75 50 L160 250 L245 50'],Ğ:['M235 85 C190 35 80 55 80 150 C80 245 190 270 235 215 L235 165 L175 165','M125 20 Q160 45 195 20'],F:['M90 250 L90 50 L230 50','M90 145 L200 145'],J:['M220 50 L220 200 C220 270 95 270 95 195']};
if(state.case==='upper')return M[U]||M.A;
const low={a:['M210 120 C175 75 90 95 90 170 C90 245 180 255 210 205','M210 105 L210 240'],n:['M90 240 L90 110','M90 160 C120 95 210 95 210 170 L210 240'],e:['M85 170 L220 170 C220 90 95 85 85 170 C80 250 190 260 225 215'],t:['M160 55 L160 210 C160 250 205 250 220 225','M110 120 L210 120'],i:['M155 120 L155 240','M155 75 L156 75'],ı:['M155 120 L155 240'],l:['M155 55 L155 240'],o:['M160 105 C75 105 75 245 160 245 C245 245 245 105 160 105'],k:['M100 55 L100 240','M215 110 L100 180 L220 240'],u:['M90 110 L90 195 C90 255 190 260 215 205','M215 110 L215 240'],r:['M105 240 L105 115','M105 160 C130 110 180 105 210 125'],m:['M70 240 L70 115','M70 160 C95 105 145 105 155 160 L155 240','M155 160 C180 105 230 105 235 165 L235 240'],ü:['M90 110 L90 195 C90 255 190 260 215 205','M215 110 L215 240','M125 75 L126 75','M190 75 L191 75'],s:['M215 125 C180 95 105 100 105 145 C105 185 215 165 215 210 C215 255 135 255 100 225'],ö:['M160 105 C75 105 75 245 160 245 C245 245 245 105 160 105','M125 75 L126 75','M195 75 L196 75'],y:['M85 110 L155 235','M230 110 L145 285'],d:['M210 55 L210 240','M210 130 C180 95 90 100 90 175 C90 250 180 255 210 215'],z:['M95 115 L220 115 L95 240 L225 240'],ç:['M225 130 C190 95 95 100 95 175 C95 250 190 255 225 220','M165 255 L155 282'],b:['M95 55 L95 240','M95 145 C130 95 220 105 220 175 C220 250 130 255 95 215'],g:['M210 120 C180 95 90 100 90 175 C90 245 180 250 210 210','M210 115 L210 240 C210 290 120 295 95 265'],c:['M225 130 C190 95 95 100 95 175 C95 250 190 255 225 220'],ş:['M215 125 C180 95 105 100 105 145 C105 185 215 165 215 210 C215 255 135 255 100 225','M165 255 L155 282'],p:['M95 290 L95 115','M95 140 C130 95 220 105 220 175 C220 245 130 255 95 215'],h:['M95 55 L95 240','M95 165 C120 105 215 105 215 175 L215 240'],v:['M85 115 L160 240 L235 115'],ğ:['M210 120 C180 95 90 100 90 175 C90 245 180 250 210 210','M210 115 L210 240 C210 290 120 295 95 265','M125 70 Q160 95 195 70'],f:['M200 65 C145 35 120 80 120 125 L120 240','M80 125 L190 125'],j:['M165 115 L165 245 C165 285 120 290 95 270','M165 75 L166 75']};return low[ch]||low.a}
function directionGame(){let c=current(),ps=guidePaths(c),svg=`<svg class="guide" viewBox="0 0 320 310"><text x="160" y="245" text-anchor="middle" font-size="240">${c}</text>`;ps.forEach((d,i)=>{svg+=`<path d="${d}" style="animation-delay:${i*1.05}s"/><circle class="dot" r="7"><animateMotion dur="1.05s" begin="${i*1.05}s" fill="freeze" path="${d}"/></circle><text x="${82+i*26}" y="292" font-size="18" fill="#1e90ff">${i+1}</text>`});svg+='</svg>';card.innerHTML=intro()+svg+`<p class="sub">Mavi nokta kalemin hareketini gösteriyor. Çizgileri <b>1, 2, 3...</b> sırasıyla izle.</p><button class="btn green" onclick="directionDone()">İzledim ✓</button><button class="btn orange" onclick="directionGame();speak('Bir kez daha izleyelim.')">Tekrar Oynat ↻</button>`}
function directionDone(){reward();speak('Harika Buğlem. Yazım yönünü öğrendin.');setTimeout(completeLevel,700)}
function drawGame(hard=false){let c=current();card.innerHTML=intro()+`<div class="traceWrap" id="trace"><div class="ghost">${c}</div><canvas id="cv" width="340" height="340"></canvas></div><p class="mini">${hard?'Bu kez daha az yardım var. Harfi kendin yaz.':'Gri harfin üzerinden başlangıç ve yazım yönüne dikkat ederek geç.'}</p><button class="btn orange" onclick="clearDraw()">Temizle</button><button class="btn green" onclick="checkDraw()">Kontrol Et</button>`;if(hard)$('.ghost').style.opacity='.28';setupDraw()}
let drawInfo={ink:0,out:false,ctx:null};function setupDraw(){let cv=$('#cv'),ctx=cv.getContext('2d');drawInfo={ink:0,out:false,ctx};ctx.lineWidth=15;ctx.lineCap='round';ctx.strokeStyle='#ff4757';let down=false,last=null;function pos(e){let r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*340/r.width,y:(p.clientY-r.top)*340/r.height}}function st(e){e.preventDefault();down=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y)}function mv(e){if(!down)return;e.preventDefault();let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();drawInfo.ink+=Math.hypot(p.x-last.x,p.y-last.y);last=p;if(p.x<7||p.y<7||p.x>333||p.y>333){drawInfo.out=true;down=false;wrong('Çizim alanından çıktın. Baştan başlayalım!');clearDraw()}}function en(){down=false}cv.addEventListener('pointerdown',st);cv.addEventListener('pointermove',mv);window.addEventListener('pointerup',en)}function clearDraw(){drawInfo.ctx?.clearRect(0,0,340,340);drawInfo.ink=0;drawInfo.out=false}function checkDraw(){if(drawInfo.ink>150&&!drawInfo.out){reward();speak('Çok güzel çizdin Buğlem!');setTimeout(completeLevel,700)}else{wrong('Biraz daha tamamlamalısın.');clearDraw()}}
function distractors(){let c=current(),pool=ALL.map(x=>state.case==='upper'?x:lowerOf(x)).filter(x=>x!==c);return pool.sort(()=>Math.random()-.5).slice(0,5)}
function choiceGame(level){let c=current(),arr=[c,...distractors().slice(0,level>15?5:2)].sort(()=>Math.random()-.5);let prompt=level%4===0?`Hangisi ${state.case==='upper'?'büyük':'küçük'} ${c}?`:level%4===1?`${c} sesini taşıyan harfi yakala!`:level%4===2?`${c} harfinin ikizini bul!`:`Doğru kapıyı seç: ${c}`;card.innerHTML=intro()+`<div class="heroLetter" style="font-size:72px">${level%3===0?'🔎':c}</div><p class="sub">${prompt}</p><div class="options">${arr.map(x=>`<button class="opt" onclick="pick(this,'${x.replace("'","\\'")}')">${x}</button>`).join('')}</div>`}
function pick(el,x){if(x===current()){el.classList.add('good');reward();speak('Tebrikler Buğlem, doğru!');setTimeout(completeLevel,650)}else{el.classList.add('bad');wrong();setTimeout(()=>el.classList.remove('bad'),450)}}
function memoryGame(){let c=current(),d=distractors().slice(0,3),vals=[c,c,...d,...d].sort(()=>Math.random()-.5),open=[],matched=0;card.innerHTML=intro()+`<p class="sub">Aynı harf çiftlerini bul. <b>${c}</b> çiftini bulunca bölüm tamamlanır.</p><div class="memory">${vals.map((v,i)=>`<button class="mem" data-v="${v}" onclick="flipMem(this)">❓</button>`).join('')}</div>`;window._mem={open,matched,target:c}}
function flipMem(el){if(el.disabled||window._mem.open.length===2)return;el.textContent=el.dataset.v;window._mem.open.push(el);if(window._mem.open.length===2){let[a,b]=window._mem.open;if(a.dataset.v===b.dataset.v){a.disabled=b.disabled=true;if(a.dataset.v===current()){reward();speak('Harika, doğru çifti buldun!');setTimeout(completeLevel,700)}window._mem.open=[]}else setTimeout(()=>{a.textContent=b.textContent='❓';window._mem.open=[]},650)}}
function missingGame(){let c=current(),word=(state.case==='upper'?c:lowerOf(c))+' _ '+c;let arr=[c,...distractors().slice(0,2)].sort(()=>Math.random()-.5);card.innerHTML=intro()+`<div class="heroLetter" style="font-size:72px">${word}</div><p class="sub">Boşluğa aynı harfi getir.</p><div class="options">${arr.map(x=>`<button class="opt" onclick="pick(this,'${x}')">${x}</button>`).join('')}</div>`}
function completeLevel(){if(state.level<25){state.level++;render();return}reward();if(state.case==='upper'){state.case='lower';state.level=1;save();celebrate();card.classList.add('bigFinish');card.innerHTML=`<div class="heroLetter">${currentUpper()}</div><h1 class="title">Büyük ${currentUpper()} tamamlandı! 🎉</h1><p class="sub">Şimdi küçük <b>${current()}</b> kardeşine geçiyoruz. Onun da 25 bölümü var.</p><button class="btn green" onclick="card.classList.remove('bigFinish');render()">Küçük ${current()} ile Başla</button>`;speak(`Tebrikler Buğlem! Büyük ${currentUpper()} harfini tamamladın. Şimdi küçük ${current()} harfine geçiyoruz.`)}else{let finished=currentUpper();if(state.letter<ALL.length-1){state.letter++;state.unlocked=Math.max(state.unlocked,state.letter);state.case='upper';state.level=1;save();celebrate();card.classList.add('bigFinish');card.innerHTML=`<h1 class="title">${finished} harfi tamam! 🏆</h1><p class="sub">Büyük ve küçük harfte toplam 50 bölüm bitti.<br>Sıradaki harf: <b>${currentUpper()}</b></p><button class="btn green" onclick="card.classList.remove('bigFinish');render()">${currentUpper()} Harfine Geç</button>`;speak(`Muhteşemsin Buğlem! ${finished} harfinin elli bölümünü bitirdin. Sırada ${currentUpper()} var.`)}else{celebrate();card.classList.add('bigFinish');card.innerHTML=`<h1 class="title">🌟 TÜM HARFLER TAMAMLANDI! 🌟</h1><p class="sub">Buğlem 29 harfin büyük ve küçük formlarındaki <b>1450 bölümü</b> tamamladı!</p><div class="heroLetter">🏆</div><button class="btn green" onclick="resetAll()">Baştan Oyna</button>`;speak('Tebrikler Buğlem! Bütün harfleri tamamladın. Sen artık bir harf ustasısın!')}}updateTop()}
function celebrate(){let cv=$('#confetti'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;let ps=Array.from({length:80},()=>({x:Math.random()*cv.width,y:-20-Math.random()*300,v:2+Math.random()*5,s:4+Math.random()*7})),f=0;(function go(){x.clearRect(0,0,cv.width,cv.height);ps.forEach((p,i)=>{p.y+=p.v;x.fillStyle=`hsl(${(i*47)%360} 85% 55%)`;x.fillRect(p.x,p.y,p.s,p.s)});if(f++<100)requestAnimationFrame(go);else x.clearRect(0,0,cv.width,cv.height)})()}
function openSettings(){$('#settings').classList.add('open');$('#voiceToggle').checked=voiceOn;$('#penaltyToggle').checked=penalty}function closeSettings(){$('#settings').classList.remove('open')}function resetAll(){if(confirm('Tüm ilerleme ve TL sıfırlansın mı?')){localStorage.removeItem('buglem_harf_v4');location.reload()}}
document.addEventListener('pointerdown',()=>{try{speechSynthesis.resume()}catch(e){}},{once:true});window.addEventListener('load',()=>{updateTop();render()});
</script>
</body></html>
