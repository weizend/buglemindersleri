<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buğlem'in Dersleri 🌟</title>
    <!-- Tam istediğin tek katlı, yuvarlak 'a' harfi için Poppins fontu -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #292F36;
            --light: #F7FFF7;
            --success: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Poppins fontu küçük 'a'yı tam gönderdiğin görseldeki gibi tek katlı yapar */
            font-family: 'Poppins', sans-serif; 
            user-select: none;
        }

        body {
            background-color: #f0f8ff;
            background-image: radial-gradient(#FFE66D 2px, transparent 2px), radial-gradient(#FF6B6B 2px, transparent 2px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* ÜST MENÜ & KUMBARA */
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 4px solid var(--secondary);
        }

        .title h1 {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 2px 2px 0px var(--accent);
        }

        .bank {
            background: var(--success);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            border: 3px solid #27ae60;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bank.pop {
            transform: scale(1.2);
        }

        /* ANA İÇERİK KUTUSU */
        .main-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            border: 5px solid var(--accent);
        }

        /* SEKMELER (Dinle, Yaz, Bul) */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #eee;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--dark);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 4px solid #ccc;
        }

        .tab-btn.active {
            background: var(--secondary);
            color: white;
            border-bottom: 4px solid #45b7af;
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* DİNLE EKRANI */
        .letter-display {
            font-size: 12rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            cursor: pointer;
            display: inline-block;
            transition: 0.2s;
            text-shadow: 5px 5px 0px var(--accent);
        }

        .letter-display:hover {
            transform: scale(1.05);
        }
        
        .letter-subtitle {
            font-size: 1.5rem;
            color: gray;
            margin-top: 10px;
        }

        /* YAZ EKRANI (Canvas) */
        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
            border: 4px dashed #ccc;
            border-radius: 20px;
            overflow: hidden;
            background: #fafafa;
        }

        /* Arkaplandaki silik harf şablonu */
        .canvas-bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            font-weight: 900;
            color: rgba(0,0,0,0.05);
            pointer-events: none;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .clear-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            border-bottom: 4px solid var(--dark-red);
        }

        /* BUL EKRANI (Oyun) */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .game-card {
            background: #fff;
            border: 4px solid #eee;
            border-radius: 20px;
            padding: 20px;
            font-size: 4rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card span {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
            color: var(--dark);
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            box-shadow: 0 10px 20px rgba(78, 205, 196, 0.2);
        }

        .game-card.correct {
            background: var(--success);
            border-color: #27ae60;
            color: white;
            animation: bounce 0.5s;
        }
        .game-card.correct span { color: white; }

        .game-card.wrong {
            background: var(--primary);
            border-color: #c0392b;
            color: white;
            animation: shake 0.4s;
        }
        .game-card.wrong span { color: white; }

        /* ÖDÜL BUTONU */
        .reward-btn {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: 900;
            margin-top: 30px;
            cursor: pointer;
            display: none;
            border: 4px solid #FF8C00;
            box-shadow: 0 10px 20px rgba(255, 165, 0, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        /* CONFETTI */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            background-color: #f00;
            z-index: 9999;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <!-- Üst Menü / Kumbara -->
    <div class="header">
        <div class="title">
            <h1><i class="fa-solid fa-star" style="color: var(--accent);"></i> Buğlem'in Dersleri</h1>
        </div>
        <div class="bank" id="bankBox">
            <i class="fa-solid fa-piggy-bank"></i>
            <span id="balance">0 TL</span>
        </div>
    </div>

    <!-- Ana Çalışma Kutusu -->
    <div class="main-container">
        
        <!-- Sekmeler -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('dinle')"><i class="fa-solid fa-ear-listen"></i> Dinle</button>
            <button class="tab-btn" onclick="showTab('yaz'); initCanvas();"><i class="fa-solid fa-pencil"></i> Yaz</button>
            <button class="tab-btn" onclick="showTab('bul')"><i class="fa-solid fa-magnifying-glass"></i> Bul</button>
        </div>

        <!-- 1. DİNLE EKRANI -->
        <div id="dinle" class="tab-content active">
            <h2 style="color: var(--secondary); margin-bottom: 20px;">Harfe tıkla ve sesini dinle!</h2>
            <div class="letter-display" onclick="speak('A')">A a</div>
            <div class="letter-subtitle">Büyük A ve Küçük a (Tıklayabilirsin)</div>
            <button class="clear-btn" style="background:var(--secondary); margin-top:30px;" onclick="markStepDone('dinle')">Dinlemeyi Bitirdim!</button>
        </div>

        <!-- 2. YAZ EKRANI -->
        <div id="yaz" class="tab-content">
            <h2 style="color: var(--secondary); margin-bottom: 20px;">Parmağınla veya fareyle harfi çiz!</h2>
            <div class="canvas-container">
                <div class="canvas-bg-text">A a</div>
                <canvas id="drawingCanvas" width="400" height="250"></canvas>
            </div>
            <br>
            <button class="clear-btn" onclick="clearCanvas()">Temizle</button>
            <button class="clear-btn" style="background:var(--success); border-color:#27ae60;" onclick="markStepDone('yaz')">Yazmayı Başardım!</button>
        </div>

        <!-- 3. BUL EKRANI (Oyun) -->
        <div id="bul" class="tab-content">
            <h2 style="color: var(--secondary); margin-bottom: 20px;">'A' harfi ile başlayanları bul!</h2>
            <div class="game-grid" id="gameGrid">
                <!-- Javascript ile doldurulacak -->
            </div>
        </div>

        <!-- ÖDÜL BUTONU (Tüm görevler bitince çıkar) -->
        <button id="rewardBtn" class="reward-btn" onclick="claimReward()">
            <i class="fa-solid fa-gift"></i> HARİKA! 100 TL KAZAN!
        </button>

    </div>

    <!-- SES EFEKTLERİ İÇİN (Web Audio API) -->
    <script>
        // DURUM YÖNETİMİ
        let balance = 0;
        let stepsCompleted = { dinle: false, yaz: false, bul: false };
        let foundCorrectItems = 0;
        const totalCorrectItems = 3; // Araba, Ayı, Aslan

        // 'A' Harfi için Oyun Verileri
        const gameItems = [
            { id: 1, name: "Araba", emoji: "🚗", startsWithA: true },
            { id: 2, name: "Kedi", emoji: "🐈", startsWithA: false },
            { id: 3, name: "Ayı", emoji: "🐻", startsWithA: true },
            { id: 4, name: "Elma", emoji: "🍎", startsWithA: false },
            { id: 5, name: "Aslan", emoji: "🦁", startsWithA: true }
        ];

        // SAYFA YÜKLENDİĞİNDE OYUNU KUR
        window.onload = () => {
            setupGame();
        };

        // SEKMELER ARASI GEÇİŞ
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // KONUŞMA SENTEZLEYİCİ (Türkçe Seslendirme)
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 0.9; // Çocuklar için biraz daha yavaş
            utterance.pitch = 1.2; // Biraz daha ince/sevimli ses
            window.speechSynthesis.speak(utterance);
        }

        // GÖREVLERİ TAMAMLAMA KONTROLÜ
        function markStepDone(step) {
            stepsCompleted[step] = true;
            playSound('pop');
            checkAllDone();
            
            if(step === 'dinle') showTab('yaz');
            if(step === 'yaz') showTab('bul');
        }

        function checkAllDone() {
            if (stepsCompleted.dinle && stepsCompleted.yaz && stepsCompleted.bul) {
                document.getElementById('rewardBtn').style.display = 'inline-block';
            }
        }

        // --- BUL OYUNU MANTIĞI ---
        function setupGame() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            
            // Öğeleri rastgele karıştır
            const shuffled = gameItems.sort(() => 0.5 - Math.random());

            shuffled.forEach(item => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `${item.emoji}<span>${item.name}</span>`;
                
                card.onclick = function() {
                    speak(item.name);
                    
                    if (item.startsWithA) {
                        if (!this.classList.contains('correct')) {
                            this.classList.add('correct');
                            playSound('success');
                            foundCorrectItems++;
                            if (foundCorrectItems === totalCorrectItems) {
                                setTimeout(() => {
                                    speak("Harika! Hepsini buldun.");
                                    markStepDone('bul');
                                }, 1000);
                            }
                        }
                    } else {
                        this.classList.add('wrong');
                        playSound('error');
                        setTimeout(() => this.classList.remove('wrong'), 500);
                    }
                };
                grid.appendChild(card);
            });
        }

        // --- ÇİZİM (CANVAS) MANTIĞI ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let canvasInitialized = false;

        function initCanvas() {
            if (canvasInitialized) return;
            
            // Çizim ayarları
            ctx.lineWidth = 15;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#FF6B6B'; // Kırmızı kalem

            // Mouse Eventleri
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Dokunmatik Ekran Eventleri (Tablet/Telefon için)
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', stopDrawing);

            canvasInitialized = true;
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function getTouchPos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.touches[0].clientX - rect.left,
                y: evt.touches[0].clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            const pos = getMousePos(e);
            ctx.moveTo(pos.x, pos.y);
        }

        function handleTouch(e) {
            e.preventDefault();
            const pos = getTouchPos(e);
            if (e.type === 'touchstart') {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            } else if (e.type === 'touchmove' && isDrawing) {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- ÖDÜL VE EFEKTLER ---
        function claimReward() {
            // Ödülü ekle
            balance += 100;
            document.getElementById('balance').innerText = balance + " TL";
            
            // Kumbara animasyonu
            const bankBox = document.getElementById('bankBox');
            bankBox.classList.add('pop');
            setTimeout(() => bankBox.classList.remove('pop'), 300);

            // Ses ve Kutlama
            speak("Tebrikler Buğlem! Yüz lira kazandın!");
            playSound('tada');
            shootConfetti();
            
            // Butonu gizle
            document.getElementById('rewardBtn').style.display = 'none';
        }

        // Konfeti Efekti
        function shootConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#2ecc71', '#9b59b6'];
            for (let i = 0; i < 100; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
                conf.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(conf);

                // 3 saniye sonra DOM'dan temizle
                setTimeout(() => conf.remove(), 3500);
            }
        }

        // Basit JS Ses Üretici (Dosya indirmeden ses çıkarmak için)
        function playSound(type) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'tada') {
                // Hızlı bir tada melodisi
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, ctx.currentTime); // A4
                osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1); // C#5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2); // E5
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3); // A5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1);
            }
        }
    </script>
</body>
</html>
