<style>
:root{--p:#ff4757;--b:#1e90ff;--y:#ffa502;--g:#2ed573;--d:#2f3542;--bg:#f4f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:radial-gradient(#dfe4ea 1.5px,transparent 1.5px) 0 0/28px 28px,var(--bg);color:var(--d);min-height:100vh;user-select:none}.top{position:sticky;top:0;z-index:30;background:#ffffffed;backdrop-filter:blur(10px);padding:10px 12px;box-shadow:0 3px 16px #0001}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.pill{border:0;border-radius:18px;padding:10px 14px;font-weight:900;background:#eef2f7;color:var(--d)}.money{background:var(--g);color:#fff}.progress{height:10px;background:#e8edf3;border-radius:20px;overflow:hidden;margin-top:9px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--g));transition:.35s}.groups{display:flex;gap:8px;overflow:auto;padding:10px 0 3px;scrollbar-width:none}.groups::-webkit-scrollbar{display:none}.group{flex:0 0 auto;border:0;border-radius:15px;padding:8px 12px;font-weight:900;background:#f1f2f6}.group.active{background:var(--b);color:#fff}.letters{display:flex;gap:7px;overflow:auto;padding:8px 0 2px;scrollbar-width:none}.letter{min-width:45px;height:45px;border:0;border-radius:14px;background:#eef2f7;font-size:21px;font-weight:900}.letter.active{background:var(--p);color:#fff;transform:scale(1.07)}.letter.locked{opacity:.42}.app{max-width:760px;margin:auto;padding:14px}.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 14px 40px #22304a18;text-align:center;min-height:470px;position:relative;overflow:hidden}.badge{display:inline-block;background:#eef5ff;color:var(--b);font-weight:900;padding:8px 13px;border-radius:16px}.title{font-size:clamp(21px,5vw,31px);margin:12px 0 5px}.sub{color:#667085;font-weight:700;line-height:1.45}.heroLetter{font-size:clamp(110px,32vw,210px);line-height:1;font-weight:900;color:var(--p);text-shadow:5px 5px 0 #ffd166;margin:18px}.btn{border:0;border-radius:17px;padding:14px 20px;font-size:17px;font-weight:900;background:var(--b);color:white;box-shadow:0 5px 0 #0b69c7;margin:7px;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:none}.btn.orange{background:var(--y);box-shadow:0 5px 0 #c77d00}.btn.green{background:var(--g);box-shadow:0 5px 0 #1aa95a}.btn.red{background:var(--p);box-shadow:0 5px 0 #c92f3d}.options{display:grid;grid-template-columns:repeat(3,minmax(75px,1fr));gap:12px;margin:20px auto;max-width:500px}.opt{min-height:92px;border:4px solid #dfe4ea;background:#f8fafc;border-radius:20px;font-size:42px;font-weight:900;color:var(--d)}.opt.good{background:#dff9e8;border-color:var(--g)}.opt.bad{animation:shake .3s;background:#ffe7e9;border-color:var(--p)}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.traceWrap{width:min(86vw,340px);height:340px;margin:15px auto;position:relative;border:4px dashed #ccd5df;border-radius:24px;background:#fbfcfe;overflow:hidden;touch-action:none}.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:230px;font-weight:900;color:#0000000d;pointer-events:none}.traceWrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.guide{width:min(90vw,430px);height:300px;margin:12px auto;background:#fbfcfe;border-radius:24px;border:3px solid #e5e9ef}.guide text{font-weight:900;fill:#0000000b}.guide path{fill:none;stroke:var(--p);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:write 1.1s ease forwards}.guide .dot{fill:var(--b)}@keyframes write{to{stroke-dashoffset:0}}.stars{font-size:30px;letter-spacing:5px;color:#ffc107}.mini{font-size:14px;color:#778;font-weight:700}.toast{position:fixed;left:50%;bottom:-100px;transform:translateX(-50%);z-index:99;padding:13px 20px;border-radius:30px;background:var(--d);color:#fff;font-weight:900;transition:.25s;max-width:90vw;text-align:center}.toast.show{bottom:25px}.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:430px;margin:18px auto}.mem{height:70px;border:0;border-radius:15px;background:#eaf1fa;font-size:28px;font-weight:900}.soundOrb{width:150px;height:150px;border-radius:50%;border:0;background:linear-gradient(145deg,#ff6b81,var(--p));color:#fff;font-size:72px;font-weight:900;box-shadow:0 12px 25px #ff475744}.handA{font-family:"Comic Sans MS","Comic Sans",cursive!important;font-weight:900}.dropZone{min-height:110px;border:4px dashed #aab7c4;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;background:#f8fafc;margin:16px auto;max-width:260px}.dragChip{display:inline-flex;align-items:center;justify-content:center;width:78px;height:78px;border:3px solid #dfe4ea;border-radius:20px;background:white;font-size:38px;font-weight:900;margin:6px;touch-action:none}.pathRow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:18px 0}.pathNode{width:62px;height:62px;border:3px solid #dfe4ea;border-radius:50%;background:#fff;font-size:28px;font-weight:900}.pathNode.done{background:#dff9e8;border-color:var(--g)}.sortBins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px auto;max-width:500px}.sortBin{min-height:130px;border:4px dashed #ccd5df;border-radius:22px;padding:10px;font-weight:900}.paintGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:500px;margin:15px auto}.paintCell{aspect-ratio:1;border:2px solid #dfe4ea;border-radius:14px;background:#fff;font-size:27px;font-weight:900}.paintCell.paint{background:#dff9e8;border-color:var(--g)}.footerNote{font-size:12px;color:#98a2b3;margin-top:12px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalBox{background:white;border-radius:25px;padding:22px;max-width:460px;width:100%;text-align:left}.modalBox h3{margin-top:0}.switch{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.bigFinish{background:linear-gradient(135deg,#ffa502,#ff6b81);color:#fff}.bigFinish .title,.bigFinish .sub{color:#fff}@media(max-width:480px){.card{padding:15px;min-height:500px}.options{gap:8px}.opt{min-height:80px}.traceWrap{height:300px}.heroLetter{margin:12px}.top{padding:8px}}

<style>
.gameGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:18px auto}
.tile{min-height:72px;border:3px solid #dfe4ea;border-radius:18px;background:#f8fafc;font-size:30px;font-weight:900}
.tile.hit{background:#dff9e8;border-color:var(--g)}.tile.wrong{background:#ffe7e9;border-color:var(--p)}
.meter{height:14px;background:#e9eef5;border-radius:20px;overflow:hidden;max-width:430px;margin:12px auto}.meter i{display:block;height:100%;background:var(--g);width:0;transition:.2s}
.balloonField{height:300px;position:relative;border:3px dashed #dfe4ea;border-radius:22px;overflow:hidden;background:#f9fbfd;margin:14px auto;max-width:520px}
.balloon{position:absolute;width:64px;height:78px;border:0;border-radius:50% 50% 45% 45%;font-size:28px;font-weight:900;background:#ffd166;animation:floatUp 5s linear forwards}
@keyframes floatUp{from{transform:translateY(310px)}to{transform:translateY(-100px)}}
.rain{position:absolute;top:-60px;font-size:34px;font-weight:900;animation:rainDown 4s linear forwards}
@keyframes rainDown{to{transform:translateY(360px)}}
.strokeBtn{min-width:70px;min-height:70px;border:3px solid #dfe4ea;border-radius:18px;background:#fff;font-size:25px;font-weight:900;margin:6px}
.door{min-height:140px;font-size:42px;background:linear-gradient(#9dd4ff,#fff);border:5px solid #6c8fb3;border-radius:24px}
.sequence{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px}.seqSlot{width:62px;height:62px;border:3px dashed #ccd5df;border-radius:15px;display:grid;place-items:center;font-size:28px;font-weight:900}
.traceHint{position:absolute;left:8px;top:8px;background:#1e90ff;color:#fff;border-radius:14px;padding:6px 9px;font-weight:900;z-index:5}
.traceStatus{font-weight:900;color:#667085;margin:7px}.pulse{animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.12)}}
</style>
</head>
<body>
<div class="top"><div class="row between"><button class="pill" onclick="openSettings()">⚙️ Ayarlar</button><div class="pill" id="where">1. Grup • A</div><div class="pill money">🐷 <span id="money">0</span> TL</div></div><div class="progress"><i id="progressBar"></i></div><div class="groups" id="groups"></div><div class="letters" id="letters"></div></div>
<main class="app"><section class="card" id="card"></section></main><div class="toast" id="toast"></div><canvas class="confetti" id="confetti"></canvas>
<div class="modal" id="settings"><div class="modalBox"><h3>👨‍👩‍👧 Ebeveyn Ayarları</h3><div class="switch"><b>Eğitici seslendirme</b><input id="voiceToggle" type="checkbox" checked onchange="saveSettings()"></div><div class="switch"><b>Yanlışta puan düşsün</b><input id="penaltyToggle" type="checkbox" checked onchange="saveSettings()"></div><p class="mini">İlerleme ve kazanılan TL bu cihazda saklanır.</p><button class="btn" onclick="closeSettings()">Kapat</button><button class="btn red" onclick="resetAll()">İlerlemeyi Sıfırla</button></div></div>
<script>
const GROUPS=[['A','N','E','T','İ','L'],['O','K','U','R','I','M'],['Ü','S','Ö','Y','D','Z'],['Ç','B','G','C','Ş'],['P','H','V','Ğ','F','J']];
const ALL=GROUPS.flat();
const lowerOf=x=>({'I':'ı','İ':'i','Ğ':'ğ','Ü':'ü','Ö':'ö','Ş':'ş','Ç':'ç'}[x]||x.toLowerCase());
const state=JSON.parse(localStorage.getItem('buglem_harf_v4')||'null')||{letter:0,case:'upper',level:1,money:0,unlocked:0};
let voiceOn=localStorage.getItem('buglem_voice')!=='0',penalty=localStorage.getItem('buglem_penalty')!=='0';
const $=s=>document.querySelector(s), card=$('#card');
function save(){localStorage.setItem('buglem_harf_v4',JSON.stringify(state))} function saveSettings(){voiceOn=$('#voiceToggle').checked;penalty=$('#penaltyToggle').checked;localStorage.setItem('buglem_voice',voiceOn?'1':'0');localStorage.setItem('buglem_penalty',penalty?'1':'0')}
function speak(t){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices(),tr=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('tr'));u.voice=tr.find(v=>/female|emel|seda|filiz|google|microsoft/i.test(v.name))||tr[0]||null;u.lang='tr-TR';u.rate=.88;u.pitch=1.18;speechSynthesis.speak(u)}
function sound(ok=true){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?760:180;g.gain.value=.06;o.start();o.stop(a.currentTime+.16)}catch(e){}}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function reward(){state.money+=10;sound(1);save();updateTop()} function wrong(t='Tekrar deneyelim!'){if(penalty)state.money=Math.max(0,state.money-2);sound(0);save();updateTop();toast(t);speak('Aaa, olmadı. Bir daha deneyelim Buğlem.')}
function currentUpper(){return ALL[state.letter]} function current(){return state.case==='upper'?currentUpper():lowerOf(currentUpper())}
function letterClass(v=current()){return v==='a'?'handA':''}
function groupIndex(i=state.letter){let n=i;for(let g=0;g<GROUPS.length;g++){if(n<GROUPS[g].length)return g;n-=GROUPS[g].length}return 4}
function buildNav(){let gs=$('#groups');gs.innerHTML='';GROUPS.forEach((g,i)=>{let b=document.createElement('button');b.className='group '+(i===groupIndex()?'active':'');b.textContent=(i+1)+'. Grup: '+g.join(' ');b.onclick=()=>{let first=GROUPS.slice(0,i).flat().length;if(first<=state.unlocked){state.letter=first;state.case='upper';state.level=1;render() }else speak('Önce önceki harfleri tamamlayalım.');};gs.appendChild(b)});let ls=$('#letters');ls.innerHTML='';ALL.forEach((l,i)=>{let b=document.createElement('button');b.className='letter '+(i===state.letter?'active':'')+(i>state.unlocked?' locked':'');b.textContent=l;b.onclick=()=>{if(i<=state.unlocked){state.letter=i;state.case='upper';state.level=1;render()}else speak(l+' harfi henüz kilitli. Önce sırayla ilerleyelim.');};ls.appendChild(b)});setTimeout(()=>$('.letter.active')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),50)}
function updateTop(){let g=groupIndex()+1;$('#where').textContent=g+'. Grup • '+currentUpper()+' • '+(state.case==='upper'?'Büyük':'Küçük')+' • '+state.level+'/25';$('#money').textContent=state.money;let total=ALL.length*50,done=state.letter*50+(state.case==='lower'?25:0)+(state.level-1);$('#progressBar').style.width=(done/total*100)+'%';buildNav()}

const titles=[
'Sesi Keşfet','Kalemin Yolunu İzle','Noktaları Sırayla Birleştir','Harf Dedektifi','Ses Kutuları',
'Büyük-Küçük Kardeşler','Hafıza Kartları','Eksik Halkayı Bul','Hızlı Gözler','Harf Balonları',
'Ses Ritmi','Çizgi Sırası Bulmacası','Gizli Yol Çizimi','Harf Yağmuru','İkiz Avı',
'Harf Treni','Gölge Dedektifi','Ses Merdiveni','Fener Avı','Doğru Kapı',
'Yardımcısız Yaz','Refleks Oyunu','Usta Kalem','5 Görevlik Sınav','Harf Ustası Finali'
];
function intro(){let c=current(),kind=state.case==='upper'?'büyük':'küçük';return `<span class="badge">${state.level}. Bölüm / 25</span><h1 class="title">${titles[state.level-1]}</h1><p class="sub">${kind} <b>${c}</b> harfi • Her bölüm farklı bir oyun</p>`}
function announce(){speak(`${state.level}. bölüm. ${titles[state.level-1]}. ${state.case==='upper'?'Büyük':'Küçük'} ${current()} harfi.`)}
function render(){save();updateTop();window._gameToken=(window._gameToken||0)+1;let l=state.level;
 const games=[listenGame,directionGame,strictTraceGame,detectiveGame,soundBoxesGame,casePairGame,memoryGame,missingRingGame,speedEyesGame,balloonGame,rhythmGame,strokeOrderGame,hiddenTraceGame,letterRainGame,twinHuntGame,trainGame,shadowGame,soundStairsGame,spotlightGame,doorGame,freeStrictGame,reactionGame,masterTraceGame,examGame,bossGame];
 games[l-1]();setTimeout(()=>announce(),250)}
function distractors(n=5){let c=current(),pool=ALL.map(x=>state.case==='upper'?x:lowerOf(x)).filter(x=>x!==c);return pool.sort(()=>Math.random()-.5).slice(0,n)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function good(msg='Harika Buğlem!'){reward();speak(msg);setTimeout(completeLevel,650)}
function choose(el,val){if(val===current()){el.classList.add('good');good('Tebrikler Buğlem, doğru harfi buldun!')}else{el.classList.add('bad');wrong();setTimeout(()=>el.classList.remove('bad'),400)}}
function listenGame(){let c=current();window._listen=0;card.innerHTML=intro()+`<button class="soundOrb pulse" onclick="listenTap()">${c}</button><p class="sub">Harfe <b>5 kez</b> dokun. Her dokunuşta sesini dinle.</p><div class="meter"><i id="listenMeter"></i></div><div id="listenCount" class="stars">☆☆☆☆☆</div>`}
function listenTap(){window._listen++;speak(current());$('#listenMeter').style.width=(window._listen*20)+'%';$('#listenCount').textContent='★'.repeat(window._listen)+'☆'.repeat(5-window._listen);if(window._listen>=5)good(`${current()} sesini çok güzel dinledin.`)}
function guidePaths(ch){let U=ch.toUpperCase();const M={A:['M85 245 L160 45','M160 45 L235 245','M115 165 L205 165'],N:['M90 245 L90 55','M90 55 L230 245','M230 245 L230 55'],E:['M225 55 L90 55 L90 245','M90 150 L200 150','M90 245 L225 245'],T:['M75 55 L245 55','M160 55 L160 245'],İ:['M160 55 L160 245','M160 22 L161 22'],I:['M160 55 L160 245'],L:['M95 55 L95 245 L230 245'],O:['M160 50 C70 50 70 250 160 250 C250 250 250 50 160 50'],K:['M95 50 L95 250','M230 50 L95 155 L235 250'],U:['M90 50 L90 190 C90 270 230 270 230 190 L230 50'],R:['M90 250 L90 50 L175 50 C245 50 245 150 175 150 L90 150','M165 150 L240 250'],M:['M70 250 L70 50 L160 165 L250 50 L250 250'],Ü:['M90 60 L90 190 C90 270 230 270 230 190 L230 60','M125 28 L126 28','M195 28 L196 28'],S:['M230 70 C190 35 95 45 95 105 C95 155 225 140 225 205 C225 265 120 270 80 230'],Ö:['M160 60 C75 60 75 250 160 250 C245 250 245 60 160 60','M125 28 L126 28','M195 28 L196 28'],Y:['M75 55 L160 155 L245 55','M160 155 L160 250'],D:['M90 250 L90 50 L160 50 C260 50 260 250 160 250 Z'],Z:['M80 55 L240 55 L80 245 L240 245'],Ç:['M235 80 C190 35 85 55 85 150 C85 245 190 265 235 220','M150 260 L140 285'],B:['M90 250 L90 50 L175 50 C240 50 240 145 175 145 L90 145','M175 145 C250 145 250 250 175 250 L90 250'],G:['M235 85 C190 35 80 55 80 150 C80 245 190 270 235 215 L235 165 L175 165'],C:['M235 80 C190 35 85 55 85 150 C85 245 190 265 235 220'],Ş:['M230 70 C190 35 95 45 95 105 C95 155 225 140 225 205 C225 265 120 270 80 230','M155 265 L145 290'],P:['M90 250 L90 50 L175 50 C250 50 250 155 175 155 L90 155'],H:['M90 50 L90 250','M230 50 L230 250','M90 150 L230 150'],V:['M75 50 L160 250 L245 50'],Ğ:['M235 85 C190 35 80 55 80 150 C80 245 190 270 235 215 L235 165 L175 165','M125 20 Q160 45 195 20'],F:['M90 250 L90 50 L230 50','M90 145 L200 145'],J:['M220 50 L220 200 C220 270 95 270 95 195']};
if(state.case==='upper')return M[U]||M.A;
const low={a:['M205 125 C180 95 125 92 92 128 C62 162 72 218 112 240 C150 261 196 238 205 198','M210 105 L210 242'],n:['M90 240 L90 110','M90 160 C120 95 210 95 210 170 L210 240'],e:['M85 170 L220 170 C220 90 95 85 85 170 C80 250 190 260 225 215'],t:['M160 55 L160 210 C160 250 205 250 220 225','M110 120 L210 120'],i:['M155 120 L155 240','M155 75 L156 75'],ı:['M155 120 L155 240'],l:['M155 55 L155 240'],o:['M160 105 C75 105 75 245 160 245 C245 245 245 105 160 105'],k:['M100 55 L100 240','M215 110 L100 180 L220 240'],u:['M90 110 L90 195 C90 255 190 260 215 205','M215 110 L215 240'],r:['M105 240 L105 115','M105 160 C130 110 180 105 210 125'],m:['M70 240 L70 115','M70 160 C95 105 145 105 155 160 L155 240','M155 160 C180 105 230 105 235 165 L235 240'],ü:['M90 110 L90 195 C90 255 190 260 215 205','M215 110 L215 240','M125 75 L126 75','M190 75 L191 75'],s:['M215 125 C180 95 105 100 105 145 C105 185 215 165 215 210 C215 255 135 255 100 225'],ö:['M160 105 C75 105 75 245 160 245 C245 245 245 105 160 105','M125 75 L126 75','M195 75 L196 75'],y:['M85 110 L155 235','M230 110 L145 285'],d:['M210 55 L210 240','M210 130 C180 95 90 100 90 175 C90 250 180 255 210 215'],z:['M95 115 L220 115 L95 240 L225 240'],ç:['M225 130 C190 95 95 100 95 175 C95 250 190 255 225 220','M165 255 L155 282'],b:['M95 55 L95 240','M95 145 C130 95 220 105 220 175 C220 250 130 255 95 215'],g:['M210 120 C180 95 90 100 90 175 C90 245 180 250 210 210','M210 115 L210 240 C210 290 120 295 95 265'],c:['M225 130 C190 95 95 100 95 175 C95 250 190 255 225 220'],ş:['M215 125 C180 95 105 100 105 145 C105 185 215 165 215 210 C215 255 135 255 100 225','M165 255 L155 282'],p:['M95 290 L95 115','M95 140 C130 95 220 105 220 175 C220 245 130 255 95 215'],h:['M95 55 L95 240','M95 165 C120 105 215 105 215 175 L215 240'],v:['M85 115 L160 240 L235 115'],ğ:['M210 120 C180 95 90 100 90 175 C90 245 180 250 210 210','M210 115 L210 240 C210 290 120 295 95 265','M125 70 Q160 95 195 70'],f:['M200 65 C145 35 120 80 120 125 L120 240','M80 125 L190 125'],j:['M165 115 L165 245 C165 285 120 290 95 270','M165 75 L166 75']};return low[ch]||low.a}

function directionGame(){let c=current(),ps=guidePaths(c),svg=`<svg class="guide" viewBox="0 0 320 310"><text x="160" y="245" text-anchor="middle" font-size="240">${c}</text>`;ps.forEach((d,i)=>{svg+=`<path d="${d}" style="animation-delay:${i*1.1}s"/><circle class="dot" r="8"><animateMotion dur="1.1s" begin="${i*1.1}s" fill="freeze" path="${d}"/></circle>`});svg+='</svg>';card.innerHTML=intro()+svg+`<p class="sub">Mavi kalemi izle. Her çizgi kendi <b>başlangıç noktasından</b> başlayıp okuma sırasıyla bitiyor.</p><button class="btn green" onclick="good('Yazım yönünü dikkatle izledin, harika!')">Yolu Öğrendim ✓</button><button class="btn orange" onclick="directionGame();speak('Bir kez daha izleyelim.')">Tekrar Oynat ↻</button>`}
let traceState=null;
function makeTrace(hideGhost=false,tolerance=27,master=false){
 let c=current(),paths=guidePaths(c);
 card.innerHTML=intro()+`<div class="traceWrap" id="trace"><span class="traceHint" id="traceHint">1. çizgi: başlangıç noktasına dokun</span><div class="ghost ${letterClass(c)}" style="${hideGhost?'opacity:0':''}">${c}</div><svg id="traceSvg" viewBox="0 0 320 310" style="position:absolute;inset:15px;width:calc(100% - 30px);height:calc(100% - 30px);pointer-events:none"></svg><canvas id="cv" width="340" height="340"></canvas></div><div class="traceStatus" id="traceStatus">Sıra: 1 / ${paths.length}</div><button class="btn orange" onclick="resetTrace()">Baştan Başla</button>`;
 let svg=$('#traceSvg'); paths.forEach((d,i)=>{let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',hideGhost?'transparent':'#1e90ff22');p.setAttribute('stroke-width',master?'5':'9');p.dataset.i=i;svg.appendChild(p)});
 let pathEls=[...svg.querySelectorAll('path')], cps=pathEls.map(p=>{let len=p.getTotalLength(),count=Math.max(4,Math.ceil(len/42));return Array.from({length:count+1},(_,i)=>{let q=p.getPointAtLength(len*i/count);return{x:q.x,y:q.y}})});
 traceState={stroke:0,point:0,cps,ctx:null,drawing:false,tolerance,paths:pathEls,master,done:false};

}
function canvasPoint(e){let cv=$('#cv'),r=cv.getBoundingClientRect(),p=e;return{x:(p.clientX-r.left)*340/r.width,y:(p.clientY-r.top)*340/r.height}}
function cpToCanvas(q){return{x:15+q.x*(310/320),y:15+q.y*(310/310)}}
function near(a,b,t){return Math.hypot(a.x-b.x,a.y-b.y)<=t}
function drawStartMarker(){/* Kontrol noktaları bilinçli olarak görünmezdir. */}
function failTrace(msg='Yanlış noktadan başladın. Animasyondaki sırayı takip et.'){wrong(msg);setTimeout(resetTrace,300)}
function setupStrictCanvas(){let cv=$('#cv'),ctx=cv.getContext('2d');traceState.ctx=ctx;ctx.lineWidth=14;ctx.lineCap='round';ctx.strokeStyle='#ff4757';
 cv.onpointerdown=e=>{e.preventDefault();if(traceState.done)return;let p=canvasPoint(e),need=cpToCanvas(traceState.cps[traceState.stroke][traceState.point]);if(traceState.point!==0||!near(p,need,traceState.tolerance)){failTrace();return}traceState.drawing=true;ctx.beginPath();ctx.moveTo(p.x,p.y);cv.setPointerCapture?.(e.pointerId)};
 cv.onpointermove=e=>{if(!traceState.drawing)return;e.preventDefault();let p=canvasPoint(e);ctx.lineTo(p.x,p.y);ctx.stroke();let arr=traceState.cps[traceState.stroke];let next=arr[traceState.point+1];if(next&&near(p,cpToCanvas(next),traceState.tolerance)){traceState.point++;$('#traceHint').textContent=`${traceState.stroke+1}. çizgi • nokta ${traceState.point+1}/${arr.length}`}};
 cv.onpointerup=e=>{if(!traceState.drawing)return;traceState.drawing=false;let arr=traceState.cps[traceState.stroke];if(traceState.point<arr.length-1){failTrace('Çizgiyi bitiş noktasına kadar götürmelisin.');return}traceState.stroke++;traceState.point=0;if(traceState.stroke>=traceState.cps.length){traceState.done=true;$('#traceHint').textContent='Tüm çizgiler doğru sırada! ✓';$('#traceStatus').textContent='Mükemmel yazım!';good('Muhteşem Buğlem! Harfi başlangıç ve bitiş yönlerine uyarak yazdın.')}else{$('#traceStatus').textContent=`Sıra: ${traceState.stroke+1} / ${traceState.cps.length}`;$('#traceHint').textContent=`${traceState.stroke+1}. çizgi: başlangıç noktasına dokun`;drawStartMarker()}};
}
function resetTrace(){if(!traceState)return;traceState.ctx.clearRect(0,0,340,340);traceState.stroke=0;traceState.point=0;traceState.done=false;$('#traceStatus').textContent=`Sıra: 1 / ${traceState.cps.length}`;$('#traceHint').textContent='1. çizgi: başlangıç noktasına dokun';drawStartMarker()}
