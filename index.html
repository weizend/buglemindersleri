<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff8fab" />
  <title>Buğlem'in Harf Dünyası</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">🌈 BUĞLEM'İN</div>
        <h1>Harf Dünyası</h1>
      </div>
      <div class="wallet" aria-label="Kumbara bakiyesi">
        <span>🐷</span>
        <div><small>Kumbaram</small><strong id="balance">0 TL</strong></div>
      </div>
    </header>

    <section class="progress-wrap">
      <div class="progress-text">
        <span id="lessonLabel">A Harfi Macerası</span>
        <span id="progressLabel">0 / 10</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </section>

    <section id="screen" class="card"></section>

    <footer>
      <button id="resetBtn" class="ghost">🔒 Ebeveyn: Eğitimi sıfırla</button>
      <p>Her görev ilk tamamlandığında <b>+10 TL</b> 🪙</p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
